<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon GO Backgrounds Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%23f4a4f8'/%3E%3Ctext%20x='8'%20y='12'%20font-size='10'%20text-anchor='middle'%20fill='%23161618'%20font-family='sans-serif'%20font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260806-global-progress">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Pokémon GO Backgrounds</h1>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search backgrounds…" autocomplete="off" aria-label="Search backgrounds">

        <details class="dropdown" id="sort-controls">
          <summary class="dropdown-trigger" aria-haspopup="menu">
            <span class="dropdown-label" id="sort-label">Newest</span>
            <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="dropdown-menu" role="menu">
            <button type="button" data-sort="newest" class="active" aria-pressed="true">Newest</button>
            <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
            <button type="button" data-sort="az" aria-pressed="false">A to Z</button>
            <button type="button" data-sort="za" aria-pressed="false">Z to A</button>
          </div>
        </details>

        <details class="dropdown" id="type-controls">
          <summary class="dropdown-trigger" aria-haspopup="menu">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
            <span class="dropdown-label" id="type-label">All</span>
            <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="dropdown-menu" role="menu">
            <button type="button" data-type="All" class="active" aria-pressed="true">All</button>
          </div>
        </details>

        <div class="pkm-search">
          <input id="pokemon-search" type="search" placeholder="Search Pokémon…" autocomplete="off" aria-label="Search Pokémon by name" role="combobox" aria-expanded="false" aria-controls="pokemon-dropdown" aria-autocomplete="list">
          <div id="pokemon-dropdown" class="pokemon-dropdown" role="listbox" hidden></div>
        </div>

        <!-- reference puts the grid/list view toggle on the filters row, right-aligned -->
        <div class="view-toggle" id="view-controls" role="group" aria-label="View">
          <button data-view="grid" class="active" aria-pressed="true" title="Grid view">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button data-view="list" aria-pressed="false" title="List view">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- reference puts the "Displaying X of Y" count on its own row below the filters -->
      <div class="count-row">
        <span id="count-label" role="status"></span>
      </div>
    </div>
  </header>
  <main id="grid" class="grid-view"></main>
  <aside class="collection-progress" id="collection-progress" aria-label="Overall collection progress">
    <div class="collection-progress-readout">
      <span id="collection-progress-percent">0%</span>
      <span class="collection-progress-marker" id="collection-progress-marker" aria-hidden="true"></span>
    </div>
    <div class="collection-progress-track" aria-hidden="true">
      <div class="collection-progress-fill" id="collection-progress-fill"></div>
    </div>
    <div class="collection-progress-caption" id="collection-progress-caption">0 / 0</div>
  </aside>
  <script src="js/storage.js?v=20260806-type-icons"></script>
  <script src="js/progress.js?v=20260806-global-progress"></script>
  <script src="js/grid.js?v=20260806-list-overflow"></script>
</body>
</html>
