<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background · Pokémon GO Backgrounds Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%23f4a4f8'/%3E%3Ctext%20x='8'%20y='12'%20font-size='10'%20text-anchor='middle'%20fill='%23161618'%20font-family='sans-serif'%20font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260806-cardtype">
</head>
<body>
  <header class="topbar">
    <div class="detail-head">
      <a class="back-link" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span>Back to all backgrounds</span>
      </a>
      <h1 id="page-title">Loading…</h1>
      <span id="collected-count" class="count">…</span>
    </div>
  </header>

  <main id="detail">
    <section class="hero">
      <img id="hero-img" alt="">
      <div class="hero-meta">
        <p id="meta-date"></p>
        <p id="description" hidden></p>
        <a id="event" href="#" target="_blank" rel="noopener" hidden>
          <img class="event-thumb" id="event-thumb" alt="" hidden>
          <strong id="event-name"></strong>
          <span id="event-dates"></span>
        </a>
      </div>
    </section>

    <div class="section-head">
      <h2 class="section-title">Pokémon <span id="pokemon-count"></span></h2>
      <div class="toolbar">
        <label class="switch" title="Display shiny forms where available">
          <input type="checkbox" id="shiny-toggle">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Shiny</span>
        </label>
      </div>
    </div>
    <div id="pokemon-list" class="pokemon-grid"></div>
  </main>

  <script src="js/storage.js?v=20260806-cardtype"></script>
  <script src="js/detail.js?v=20260806-cardtype"></script>
</body>
</html>
